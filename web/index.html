<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executioner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            surface: {
              950: '#09090b',
              900: '#0f0f12',
              800: '#18181b',
              700: '#27272a',
              600: '#3f3f46',
            },
            accent: {
              DEFAULT: '#6366f1',
              hover: '#818cf8',
              muted: '#4f46e5',
            },
          },
        },
      },
    };
  </script>
</head>
<body class="bg-surface-950 text-zinc-100 font-sans antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-zinc-800/80 bg-surface-900/80 backdrop-blur-sm sticky top-0 z-50">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-8 h-8 rounded-lg bg-accent/10 border border-accent/20 flex items-center justify-center shrink-0">
          <span class="text-accent font-semibold text-sm tracking-tight">EX</span>
        </div>
        <div class="min-w-0">
          <h1 class="text-base font-semibold tracking-tight text-zinc-50 truncate">Executioner</h1>
          <p class="text-xs text-zinc-500 hidden sm:block">Secure code playground</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">
        <div class="relative">
          <select id="language" class="appearance-none bg-surface-800 border border-zinc-700/80 text-zinc-200 text-sm rounded-lg pl-3 pr-8 py-2 focus:outline-none focus:ring-1 focus:ring-accent/50 focus:border-accent/50 hover:border-zinc-600 transition-colors cursor-pointer">
          </select>
          <svg class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>

        <button id="run-btn" class="inline-flex items-center gap-2 bg-accent hover:bg-accent-hover text-white text-sm font-medium rounded-lg px-4 py-2 transition-colors focus:outline-none focus:ring-2 focus:ring-accent/40 disabled:opacity-50 disabled:cursor-not-allowed">
          <svg id="run-icon" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          <svg id="loading-icon" class="w-4 h-4 hidden animate-spin" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          <span class="hidden sm:inline">Run</span>
          <span class="sm:hidden">Go</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-[1600px] mx-auto w-full px-4 sm:px-6 py-4 flex flex-col gap-4 min-h-0">

    <!-- Editor -->
    <section class="flex flex-col min-h-[280px] lg:min-h-[360px] flex-1 rounded-xl border border-zinc-800/80 bg-surface-900 overflow-hidden">
      <div class="flex items-center justify-between px-4 py-2.5 border-b border-zinc-800/80 bg-surface-800/40">
        <div class="flex items-center gap-2 text-sm text-zinc-400">
          <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <span>Editor</span>
        </div>
        <span class="text-xs text-zinc-600 font-mono hidden sm:inline">Ctrl + Enter to run</span>
      </div>
      <div id="editor" class="flex-1 min-h-[220px]"></div>
    </section>

    <!-- Input / Output -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 min-h-[200px] lg:min-h-[240px]">

      <!-- Stdin -->
      <section class="flex flex-col rounded-xl border border-zinc-800/80 bg-surface-900 overflow-hidden">
        <div class="flex items-center gap-2 px-4 py-2.5 border-b border-zinc-800/80 bg-surface-800/40">
          <svg class="w-4 h-4 text-zinc-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
          <span class="text-sm text-zinc-400">Input</span>
        </div>
        <textarea id="stdin" placeholder="Standard input (optional)" class="flex-1 min-h-[140px] bg-transparent text-zinc-200 font-mono text-sm p-4 resize-none focus:outline-none placeholder:text-zinc-600"></textarea>
      </section>

      <!-- Output -->
      <section class="flex flex-col rounded-xl border border-zinc-800/80 bg-surface-900 overflow-hidden">
        <div class="flex items-center justify-between px-4 py-2.5 border-b border-zinc-800/80 bg-surface-800/40">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-zinc-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            <span class="text-sm text-zinc-400">Output</span>
          </div>
          <div id="status-badge" class="hidden items-center gap-1.5 text-xs font-medium px-2 py-0.5 rounded-md">
            <span id="status-dot" class="w-1.5 h-1.5 rounded-full"></span>
            <span id="status-text"></span>
          </div>
        </div>
        <div class="flex-1 min-h-[140px] overflow-auto">
          <pre id="stdout" class="font-mono text-sm p-4 text-emerald-400/90 whitespace-pre-wrap break-words empty:hidden"></pre>
          <pre id="stderr" class="font-mono text-sm px-4 pb-4 text-red-400/90 whitespace-pre-wrap break-words empty:hidden"></pre>
          <p id="output-placeholder" class="text-sm text-zinc-600 p-4">Run your code to see output here</p>
        </div>
        <div id="meta-bar" class="hidden border-t border-zinc-800/80 px-4 py-2 flex items-center gap-4 text-xs text-zinc-500 font-mono bg-surface-800/30">
          <span id="meta-time"></span>
          <span id="meta-exit"></span>
          <span id="meta-memory"></span>
        </div>
      </section>
    </div>
  </main>

  <footer class="border-t border-zinc-800/60 py-3 text-center text-xs text-zinc-600">
    Runs in isolated Docker containers &middot; No network access
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
  <script>
    const TEMPLATES = {
      python: `def solve():
    a, b = map(int, input().split())
    print(a + b)

if __name__ == "__main__":
    solve()`,
      cpp: `#include <iostream>
using namespace std;

int main() {
    int a, b;
    cin >> a >> b;
    cout << a + b << endl;
    return 0;
}`,
      javascript: `const fs = require('fs');
const input = fs.readFileSync('/dev/stdin', 'utf8').trim().split(/\\s+/);
const a = parseInt(input[0], 10);
const b = parseInt(input[1], 10);
console.log(a + b);`,
      typescript: `const fs = require('fs');
const input = fs.readFileSync('/dev/stdin', 'utf8').trim().split(/\\s+/);
const a = parseInt(input[0], 10);
const b = parseInt(input[1], 10);
console.log(a + b);`,
    };

    const MONACO_LANG = {
      python: 'python',
      cpp: 'cpp',
      javascript: 'javascript',
      typescript: 'typescript',
    };

    let editor = null;
    let running = false;

    const $ = (id) => document.getElementById(id);

    function setRunning(isRunning) {
      running = isRunning;
      $('run-btn').disabled = isRunning;
      $('run-icon').classList.toggle('hidden', isRunning);
      $('loading-icon').classList.toggle('hidden', !isRunning);
    }

    function clearOutput() {
      $('stdout').textContent = '';
      $('stderr').textContent = '';
      $('output-placeholder').classList.remove('hidden');
      $('status-badge').classList.add('hidden');
      $('status-badge').classList.remove('flex');
      $('meta-bar').classList.add('hidden');
    }

    function showStatus(status, errorType) {
      const badge = $('status-badge');
      const dot = $('status-dot');
      const text = $('status-text');

      badge.classList.remove('hidden');
      badge.classList.add('flex');

      const styles = {
        success: { bg: 'bg-emerald-500/10 text-emerald-400', dot: 'bg-emerald-400', label: 'Success' },
        runtime_error: { bg: 'bg-red-500/10 text-red-400', dot: 'bg-red-400', label: 'Runtime Error' },
        error: { bg: 'bg-amber-500/10 text-amber-400', dot: 'bg-amber-400', label: errorType || 'Error' },
      };

      const s = styles[status] || styles.error;
      badge.className = `flex items-center gap-1.5 text-xs font-medium px-2 py-0.5 rounded-md ${s.bg}`;
      dot.className = `w-1.5 h-1.5 rounded-full ${s.dot}`;
      text.textContent = s.label;
    }

    function showResult(data) {
      $('output-placeholder').classList.add('hidden');

      if (data.stdout) {
        $('stdout').textContent = data.stdout;
      }
      if (data.stderr) {
        $('stderr').textContent = data.stderr;
      }
      if (!data.stdout && !data.stderr) {
        $('output-placeholder').textContent = '(no output)';
        $('output-placeholder').classList.remove('hidden');
      }

      showStatus(data.status, data.error_type);

      $('meta-bar').classList.remove('hidden');
      $('meta-time').textContent = `${data.time_ms}ms`;
      $('meta-exit').textContent = `exit ${data.exit_code}`;
      if (data.memory_kb > 0) {
        $('meta-memory').textContent = `${data.memory_kb} KB`;
      } else {
        $('meta-memory').textContent = '';
      }
    }

    function showError(message) {
      $('output-placeholder').classList.add('hidden');
      $('stderr').textContent = message;
      showStatus('error', 'Request Failed');
    }

    async function loadLanguages() {
      const res = await fetch('/languages');
      const langs = await res.json();
      const select = $('language');
      select.innerHTML = '';
      langs.forEach((lang) => {
        const opt = document.createElement('option');
        opt.value = lang.id;
        opt.textContent = lang.name;
        select.appendChild(opt);
      });
      return langs[0]?.id || 'python';
    }

    async function runCode() {
      if (running || !editor) return;

      clearOutput();
      setRunning(true);

      const language = $('language').value;
      const body = {
        language,
        source_code: editor.getValue(),
        stdin: $('stdin').value,
        time_limit: 5,
        memory_limit: 256,
      };

      try {
        const res = await fetch('/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        if (!res.ok) {
          const errText = await res.text();
          showError(errText || `HTTP ${res.status}`);
          return;
        }

        const data = await res.json();
        showResult(data);
      } catch (err) {
        showError(err.message || 'Network error');
      } finally {
        setRunning(false);
      }
    }

    function onLanguageChange(langId) {
      if (!editor) return;
      const template = TEMPLATES[langId];
      if (template) {
        editor.setValue(template);
      }
      monaco.editor.setModelLanguage(editor.getModel(), MONACO_LANG[langId] || 'plaintext');
    }

    self.MonacoEnvironment = {
      getWorkerUrl: () => {
        const base = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/';
        const code = `self.MonacoEnvironment={baseUrl:'${base}'};importScripts('${base}vs/base/worker/workerMain.js');`;
        return URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      },
    };

    require.config({
      paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' },
    });

    require(['vs/editor/editor.main'], async () => {
      const defaultLang = await loadLanguages();

      editor = monaco.editor.create($('editor'), {
        value: TEMPLATES[defaultLang] || '',
        language: MONACO_LANG[defaultLang] || 'plaintext',
        theme: 'vs-dark',
        fontFamily: 'JetBrains Mono, monospace',
        fontSize: 14,
        lineHeight: 22,
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        padding: { top: 12, bottom: 12 },
        renderLineHighlight: 'line',
        smoothScrolling: true,
        automaticLayout: true,
        tabSize: 4,
        wordWrap: 'on',
      });

      $('language').addEventListener('change', (e) => onLanguageChange(e.target.value));
      $('run-btn').addEventListener('click', runCode);

      $('stdin').value = '3 5';

      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          runCode();
        }
      });
    });
  </script>
</body>
</html>
